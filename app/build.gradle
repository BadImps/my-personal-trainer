plugins {
    id 'com.android.application'
}

def releaseProperties = new Properties()
def releasePropertiesFile = System.getenv('MPT_SIGNING_PROPERTIES')
        ? file(System.getenv('MPT_SIGNING_PROPERTIES'))
        : rootProject.file('release-signing.properties')
def previewProperties = new Properties()
def previewPropertiesFile = rootProject.file('signing/upload-signing.properties')
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def quotedBuildValue = { String value -> '"' + (value ?: '').replace('\\', '\\\\').replace('"', '\\"') + '"' }
// A one-time debug-signed bridge can update existing legacy installs, export their data,
// then make way for the protected production signature. Normal production builds remain signed.
def migrationBridge = project.hasProperty('migrationBridge')
if (releasePropertiesFile.exists()) {
    releasePropertiesFile.withInputStream { releaseProperties.load(it) }
}
if (previewPropertiesFile.exists()) {
    previewPropertiesFile.withInputStream { previewProperties.load(it) }
}

android {
    namespace 'com.badimps.personaltrainer'
    compileSdk 36
    signingConfigs {
        production {
            def configuredStoreFile = releaseProperties.getProperty('storeFile', 'keys/my-personal-trainer-release.jks')
            // Signing properties normally sit beside the project.  When a protected copy is
            // supplied from a recovery location, keep its existing app-relative path intact.
            def signingBase = releasePropertiesFile.parentFile.canonicalPath == rootProject.projectDir.canonicalPath
                    ? project.projectDir : new File(releasePropertiesFile.parentFile, 'app')
            storeFile new File(signingBase, configuredStoreFile)
            storePassword releaseProperties.getProperty('storePassword', '')
            keyAlias releaseProperties.getProperty('keyAlias', 'my-personal-trainer')
            keyPassword releaseProperties.getProperty('keyPassword', '')
        }
        preview {
            storeFile rootProject.file(previewProperties.getProperty('UPLOAD_STORE_FILE', 'signing/my-personal-trainer-upload.jks'))
            storePassword previewProperties.getProperty('UPLOAD_STORE_PASSWORD', '')
            keyAlias previewProperties.getProperty('UPLOAD_KEY_ALIAS', 'upload')
            keyPassword previewProperties.getProperty('UPLOAD_KEY_PASSWORD', '')
        }
    }
    defaultConfig {
        applicationId 'com.badimps.personaltrainer'
        minSdk 26
        targetSdk 36
        versionCode (migrationBridge ? 73 : 132)
        versionName (migrationBridge ? '5.31 Migration' : '5.90')
        resValue 'string', 'app_display_name', 'My Personal Trainer'
        buildConfigField 'boolean', 'PREVIEW_BUILD', 'false'
        // The anon/publishable key is intentionally a client credential. Never place a
        // service-role key in an APK. RLS remains the actual database security boundary.
        buildConfigField 'String', 'SUPABASE_URL', quotedBuildValue(localProperties.getProperty('SUPABASE_URL', ''))
        buildConfigField 'String', 'SUPABASE_ANON_KEY', quotedBuildValue(localProperties.getProperty('SUPABASE_ANON_KEY', ''))
    }
    flavorDimensions += 'distribution'
    productFlavors {
        production {
            dimension 'distribution'
            signingConfig releasePropertiesFile.exists() ? signingConfigs.production : signingConfigs.debug
        }
        preview {
            dimension 'distribution'
            applicationIdSuffix '.preview'
            versionNameSuffix '-preview'
            resValue 'string', 'app_display_name', 'My Personal Trainer Preview'
            buildConfigField 'boolean', 'PREVIEW_BUILD', 'true'
            signingConfig previewPropertiesFile.exists() ? signingConfigs.preview : signingConfigs.debug
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.includeAndroidResources = true }
    buildFeatures { buildConfig true }
    buildTypes {
        migration {
            initWith debug
            signingConfig signingConfigs.debug
        }
        release {
            // CI deliberately has no private key. It may lint the release variant using the
            // debug certificate, while a local production invocation uses the protected key.
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.activity:activity:1.11.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'
    implementation 'org.mapsforge:mapsforge-map-android:0.25.0'
    implementation 'org.mapsforge:mapsforge-themes:0.25.0'
    // GPU-rendered vector map surface. Country data remains app-private and is
    // supplied by the offline-map pack system rather than a metered map API.
    implementation 'org.maplibre.gl:android-sdk:11.11.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16'
}
