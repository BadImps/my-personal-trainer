plugins {
    id 'com.android.application'
}

def releaseProperties = new Properties()
def releasePropertiesPath = project.findProperty('releaseSigningPropertiesPath')
def releasePropertiesFile = releasePropertiesPath == null || releasePropertiesPath.trim().isEmpty()
        ? rootProject.file('release-signing.properties')
        : file(releasePropertiesPath)
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def quotedBuildValue = { String value -> '"' + (value ?: '').replace('\\', '\\\\').replace('"', '\\"') + '"' }
// A one-time debug-signed bridge can update existing legacy installs, export their data,
// then make way for the protected production signature. Normal production builds remain signed.
def migrationBridge = project.hasProperty('migrationBridge')
if (releasePropertiesFile.exists()) {
    releasePropertiesFile.withInputStream { releaseProperties.load(it) }
}
def releaseStoreFile = new File(releaseProperties.getProperty('storeFile', 'keys/my-personal-trainer-release.jks'))
if (!releaseStoreFile.isAbsolute()) releaseStoreFile = new File(releasePropertiesFile.parentFile, releaseStoreFile.path)
// Older private signing files used a path relative to a different checkout. Prefer the keystore
// stored beside this signing file when that old relative path is no longer valid.
if (!releaseStoreFile.exists() && releasePropertiesFile.parentFile != null) {
    releaseStoreFile = new File(new File(releasePropertiesFile.parentFile, 'keys'), releaseStoreFile.name)
}

android {
    namespace 'com.badimps.personaltrainer'
    compileSdk 36
    signingConfigs {
        production {
            storeFile releaseStoreFile
            storePassword releaseProperties.getProperty('storePassword', '')
            keyAlias releaseProperties.getProperty('keyAlias', 'my-personal-trainer')
            keyPassword releaseProperties.getProperty('keyPassword', '')
        }
    }
    defaultConfig {
        applicationId 'com.badimps.personaltrainer'
        minSdk 26
        targetSdk 36
        versionCode (migrationBridge ? 73 : 150)
        versionName (migrationBridge ? '5.31 Migration' : '6.8')
        // The anon/publishable key is intentionally a client credential. Never place a
        // service-role key in an APK. RLS remains the actual database security boundary.
        buildConfigField 'String', 'SUPABASE_URL', quotedBuildValue(localProperties.getProperty('SUPABASE_URL', ''))
        buildConfigField 'String', 'SUPABASE_ANON_KEY', quotedBuildValue(localProperties.getProperty('SUPABASE_ANON_KEY', ''))
        // GitHub APK delivery remains available for private sideloads. The dedicated
        // Play build overrides this and removes package-installer capabilities.
        buildConfigField 'String', 'DISTRIBUTION_CHANNEL', '"direct"'
        buildConfigField 'boolean', 'PREVIEW_BUILD', 'false'
        // A public Android-restricted client key. The real value stays only in local.properties
        // (or CI secrets); an empty value keeps MapLibre as the safe offline fallback.
        buildConfigField 'String', 'GOOGLE_MAPS_API_KEY', quotedBuildValue(localProperties.getProperty('GOOGLE_MAPS_API_KEY', ''))
        manifestPlaceholders = [MAPS_API_KEY: localProperties.getProperty('GOOGLE_MAPS_API_KEY', '')]
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.includeAndroidResources = true }
    buildFeatures { buildConfig true }
    buildTypes {
        migration {
            initWith debug
            signingConfig signingConfigs.debug
        }
        release {
            // CI deliberately has no private key. It may lint the release variant using the
            // debug certificate, while a local production invocation uses the protected key.
            // Never create a release artifact with the public Android debug certificate.
            // Without local production credentials Gradle produces an unsigned artifact.
            signingConfig releasePropertiesFile.exists() ? signingConfigs.production : null
        }
        play {
            initWith release
            matchingFallbacks = ['release']
            buildConfigField 'String', 'DISTRIBUTION_CHANNEL', '"play"'
            signingConfig releasePropertiesFile.exists() ? signingConfigs.production : null
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.activity:activity:1.11.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'
    implementation 'com.google.android.gms:play-services-maps:20.0.0'
    implementation 'com.google.android.material:material:1.12.0'
    // 4.3.1 includes the current Place Autocomplete widget while remaining compatible with
    // this project's Android Gradle/Kotlin toolchain.
    implementation 'com.google.android.libraries.places:places:4.3.1'
    implementation 'androidx.wear:wear-remote-interactions:1.2.0'
    implementation 'org.mapsforge:mapsforge-map-android:0.25.0'
    implementation 'org.mapsforge:mapsforge-themes:0.25.0'
    // GPU-rendered vector map surface. Country data remains app-private and is
    // supplied by the offline-map pack system rather than a metered map API.
    implementation 'org.maplibre.gl:android-sdk:11.11.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16'
}
