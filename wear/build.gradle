plugins { id 'com.android.application' }

def releaseProperties = new Properties()
def releasePropertiesFile = rootProject.file('release-signing.properties')
if (releasePropertiesFile.exists()) {
    releasePropertiesFile.withInputStream { releaseProperties.load(it) }
}

android {
    namespace 'com.badimps.personaltrainer'
    compileSdk 36
    signingConfigs {
        production {
            storeFile file(releaseProperties.getProperty('storeFile', '../keys/my-personal-trainer-release.jks'))
            storePassword releaseProperties.getProperty('storePassword', '')
            keyAlias releaseProperties.getProperty('keyAlias', 'my-personal-trainer')
            keyPassword releaseProperties.getProperty('keyPassword', '')
        }
    }
    defaultConfig {
        applicationId 'com.badimps.personaltrainer'
        minSdk 30
        targetSdk 36
        versionCode 131
        versionName '5.89'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes {
        release {
            signingConfig releasePropertiesFile.exists() ? signingConfigs.production : signingConfigs.debug
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.wear:wear:1.3.0'
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'
}
