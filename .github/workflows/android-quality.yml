name: Android quality gate

on:
  pull_request:
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradlew"
      - ".github/workflows/android-quality.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradlew"
      - ".github/workflows/android-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Run unit tests, lint, and debug package
        run: ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleDebug --console=plain
