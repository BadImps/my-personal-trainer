name: Publish preview APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag, for example preview-v5.88
        required: true
        type: string
      notes:
        description: Short release notes for preview testers
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Restore the encrypted preview signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MPT_PREVIEW_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MPT_PREVIEW_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MPT_PREVIEW_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MPT_PREVIEW_KEY_PASSWORD }}
        run: |
          mkdir -p signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > signing/preview.jks
          {
            printf 'UPLOAD_STORE_FILE=signing/preview.jks\n'
            printf 'UPLOAD_STORE_PASSWORD=%s\n' "$STORE_PASSWORD"
            printf 'UPLOAD_KEY_ALIAS=%s\n' "$KEY_ALIAS"
            printf 'UPLOAD_KEY_PASSWORD=%s\n' "$KEY_PASSWORD"
          } > signing/upload-signing.properties
      - name: Build signed preview APK
        run: ./gradlew :app:assemblePreviewRelease --no-daemon
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          NOTES: ${{ inputs.notes }}
        run: |
          gh release create "$TAG" app/build/outputs/apk/preview/release/app-preview-release.apk \
            --title "My Personal Trainer Preview" --notes "$NOTES"
      - name: Publish the matching preview update manifest
        env:
          TAG: ${{ inputs.tag }}
          NOTES: ${{ inputs.notes }}
        run: |
          APK=app/build/outputs/apk/preview/release/app-preview-release.apk
          METADATA=app/build/outputs/apk/preview/release/output-metadata.json
          VERSION_CODE=$(jq -r '.elements[0].versionCode' "$METADATA")
          VERSION_NAME=$(jq -r '.elements[0].versionName' "$METADATA")
          SHA256=$(sha256sum "$APK" | awk '{print $1}')
          SIZE_BYTES=$(stat --printf='%s' "$APK")
          jq -n \
            --arg applicationId "com.badimps.personaltrainer.preview" \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg apkUrl "https://github.com/BadImps/my-personal-trainer/releases/download/$TAG/app-preview-release.apk" \
            --arg sha256 "$SHA256" \
            --argjson sizeBytes "$SIZE_BYTES" \
            --arg notes "$NOTES" \
            '{applicationId: $applicationId, versionCode: $versionCode, versionName: $versionName, publishedAt: $publishedAt, apkUrl: $apkUrl, sha256: $sha256, sizeBytes: $sizeBytes, notes: $notes}' \
            > docs/preview/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/preview/latest.json
          git commit -m "chore: publish preview OTA manifest for $VERSION_NAME"
          git push
